name: Build Windows Installers

on:
  push:
    branches:
      - feature/ollama-pet-assistant
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 installers
    runs-on: windows-latest
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri v2 CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Install WiX and populate Tauri's local tool cache
        run: |
          choco install wixtoolset --version=3.14.1.20250415 --yes --no-progress
          $programFilesX86 = ${env:ProgramFiles(x86)}
          $wixBin = Join-Path $programFilesX86 'WiX Toolset v3.14\bin'
          if (!(Test-Path (Join-Path $wixBin 'candle.exe')) -or !(Test-Path (Join-Path $wixBin 'light.exe'))) {
            throw "WiX 3.14 was not found at $wixBin"
          }
          $wixCache = Join-Path $env:LOCALAPPDATA 'tauri\WixTools314'
          New-Item -ItemType Directory -Force -Path $wixCache | Out-Null
          Copy-Item -Path (Join-Path $wixBin '*') -Destination $wixCache -Recurse -Force
          $requiredFiles = @('candle.exe', 'candle.exe.config', 'darice.cub', 'light.exe', 'light.exe.config', 'wconsole.dll', 'winterop.dll', 'wix.dll', 'WixUIExtension.dll', 'WixUtilExtension.dll')
          foreach ($file in $requiredFiles) {
            if (!(Test-Path (Join-Path $wixCache $file))) { throw "Missing cached WiX file: $file" }
          }

      - name: Build MSI installer
        id: build_msi
        working-directory: src-tauri
        run: cargo tauri build --bundles msi

      - name: Try NSIS setup installer
        id: build_nsis
        continue-on-error: true
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis

      - name: Upload Windows installers
        if: always() && steps.build_msi.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Clawd-Windows-Installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
