name: Build Windows Installers

on:
  push:
    branches:
      - feature/ollama-pet-assistant
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 installers
    runs-on: windows-latest
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri v2 CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Install WiX Toolset for MSI packaging
        run: |
          choco install wixtoolset --version=3.14.1.20250415 --yes --no-progress
          $wixBin = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin'
          if (!(Test-Path (Join-Path $wixBin 'candle.exe')) -or !(Test-Path (Join-Path $wixBin 'light.exe'))) {
            throw "WiX 3.14 was not found at $wixBin"
          }
          $env:PATH = "$wixBin;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin

      - name: Build MSI and NSIS installers
        working-directory: src-tauri
        run: cargo tauri build --bundles "msi,nsis"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Clawd-Windows-Installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
